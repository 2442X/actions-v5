name: Codespell

on:
  push:
    paths:
      - "**.py"
      - "**.cpp"
      - "**.cc"
      - "**.hpp"
      - "**.h"
      - "**.md"
      - "**.txt"
      - ".codespellrc"
      - ".github/workflows/codespell.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      patterns:
        description: Space-separated globs of files to check
        type: string
        default: "*.py *.cpp *.cc *.hpp *.h *.md *.txt"

permissions:
  contents: read

jobs:
  codespell:
    name: codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install codespell

      - name: codespell
        env:
          PATTERNS: ${{ inputs.patterns || '*.py *.cpp *.cc *.hpp *.h *.md *.txt' }}
        run: |
          set -f
          git ls-files -z -- $PATTERNS | xargs -0 -r codespell
