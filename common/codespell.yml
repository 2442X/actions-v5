name: Codespell

on:
  push:
    paths:
      - "**.py"
      - "**.cpp"
      - "**.cc"
      - "**.hpp"
      - "**.h"
      - "**.md"
      - "**.txt"
      - ".codespellrc"
      - ".github/workflows/codespell.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      patterns:
        description: Space-separated globs of files to check
        type: string
        default: "*.py *.cpp *.cc *.hpp *.h *.md *.txt"

permissions:
  contents: read

jobs:
  codespell:
    name: codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/py/setup
        with:
          packages: codespell

      - id: files
        uses: ./.github/actions/shared/list-files
        with:
          patterns: ${{ inputs.patterns || '*.py *.cpp *.cc *.hpp *.h *.md *.txt' }}

      - if: steps.files.outputs.count != '0'
        run: xargs -a "${{ steps.files.outputs.list }}" codespell
