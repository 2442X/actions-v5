name: Lint Python

on:
  push:
    branches: [main, master]
    paths:
      - "**.py"
      - "ruff.toml"
      - "pyproject.toml"
      - ".github/workflows/lint-python.yml"
  pull_request:
    paths:
      - "**.py"
      - "ruff.toml"
      - "pyproject.toml"
      - ".github/workflows/lint-python.yml"

jobs:
  lint-python:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff (lint)
        run: |
          ruff check . \
            --select E4,E7,E9,F,W \
            --ignore F821,F403,F405,E501 \
            --exclude build,.venv

      - name: Ruff (format)
        continue-on-error: true
        run: ruff format --check --diff . --exclude build,.venv
