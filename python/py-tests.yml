name: Python Tests

on:
  push:
    paths:
      - "**.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - "setup.cfg"
      - "tox.ini"
      - ".github/workflows/py-tests.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/py/setup
        with:
          packages: pytest

      - run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - run: pytest -q || [ $? -eq 5 ]
