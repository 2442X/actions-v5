name: Python Syntax

on:
  push:
    paths:
      - "**.py"
      - ".github/workflows/py-syntax.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  syntax:
    name: compileall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: python -m compileall -q . -x '(\.venv|build|\.git)'
