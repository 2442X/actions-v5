name: Python Lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/py/setup
        with:
          packages: ruff

      - run: ruff check .

      - name: Format check (advisory)
        continue-on-error: true
        run: ruff format --check --diff .
