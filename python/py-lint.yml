name: Python Lint

on:
  push:
    paths:
      - "**.py"
      - "ruff.toml"
      - ".ruff.toml"
      - "pyproject.toml"
      - ".github/workflows/py-lint.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install ruff

      - run: ruff check .

      - name: Format check (advisory)
        continue-on-error: true
        run: ruff format --check --diff .
