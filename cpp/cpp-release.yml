name: C++ Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/cpp-build.yml

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.bin"
          generate_release_notes: true
          fail_on_unmatched_files: true
