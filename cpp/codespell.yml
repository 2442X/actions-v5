name: Codespell

on:
  workflow_call:
    inputs:
      patterns:
        description: Space-separated globs of files to check
        type: string
        required: true

permissions:
  contents: read

jobs:
  codespell:
    name: codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/py/setup
        with:
          packages: codespell

      - id: files
        uses: ./.github/actions/shared/list-files
        with:
          patterns: ${{ inputs.patterns }}

      - if: steps.files.outputs.count != '0'
        run: xargs -a "${{ steps.files.outputs.list }}" codespell
