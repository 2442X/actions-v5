name: Lint C++

on:
  push:
    paths:
      - "**.cpp"
      - "**.cc"
      - "**.hpp"
      - "**.h"
      - ".clang-format"
      - ".github/workflows/cpp-lint.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      fallback-style:
        description: clang-format style used when no .clang-format exists
        type: string
        default: Google

permissions:
  contents: read

jobs:
  lint:
    name: clang-format + cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cppcheck

      - name: clang-format
        env:
          FALLBACK_STYLE: ${{ inputs.fallback-style || 'Google' }}
        run: |
          git ls-files -z -- '*.cpp' '*.cc' '*.hpp' '*.h' | xargs -0 -r \
            clang-format --style=file --fallback-style="$FALLBACK_STYLE" --dry-run --Werror

      - name: cppcheck
        run: |
          git ls-files -z -- '*.cpp' '*.cc' '*.hpp' '*.h' | xargs -0 -r cppcheck \
            --enable=warning,style,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unknownMacro \
            --error-exitcode=1 \
            --quiet
